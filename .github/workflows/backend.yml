# Constrói a imagem do backend e publica no GHCR.
#
# A VPS **não** tem o repositório. Ela não faz git clone, não compila e não
# precisa de JDK nem Maven: recebe uma imagem pronta e só sabe o nome dela.
# O GitHub nunca conecta na VPS — é ela que puxa.
name: backend

on:
  push:
    # `dev` NÃO dispara nada, igual ao lingua: é onde se trabalha. O que sobe
    # para a VPS é `hmg` — o merge é o ato deliberado de publicar.
    #
    # Uma tag por branch: hmg publica :hmg, main publica :main. A VPS escolhe
    # qual usa pelo AM_TAG do .env, então homologar não mexe no que está no ar.
    branches: [hmg, main]
  # Sem filtro de `paths`, de propósito. Duas razões:
  #
  # 1. Numa branch recém-criada o GitHub não avalia o filtro de forma confiável
  #    e o build simplesmente não roda — foi o que aconteceu ao criar a `hmg`,
  #    e o sintoma é a VPS não achar a imagem sem nenhum erro em lugar nenhum.
  #
  # 2. Filtro de caminho numa branch de DEPLOY é errado de qualquer forma. Push
  #    em `hmg` quer dizer "publica isto", mesmo que a mudança tenha sido só no
  #    compose ou no README. Republicar uma imagem idêntica é barato; descobrir
  #    que ela não subiu, não.

  # Botão manual: útil para republicar sem precisar de um commit vazio.
  workflow_dispatch:

env:
  # Literal, e minúsculo. `github.repository_owner` devolve `MatheusZem12` com
  # maiúsculas, e o GHCR recusa: "repository name must be lowercase".
  #
  # Escrito à mão também garante que bate com o nome que o
  # deploy/vps/service/docker-compose.yml usa no `image:`. Se os dois
  # divergissem, o build passaria e a VPS puxaria um nome que nunca existiu.
  IMAGEM: ghcr.io/matheuszem12/activity-manager-backend

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Os testes rodam ANTES do build da imagem: o que sobe é o que passou.
      - name: Testes
        working-directory: backend
        run: mvn -B test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.ref_name }}
            ${{ env.IMAGEM }}:${{ github.sha }}
          # Cache no próprio registry: sem isto cada push recompila o mundo e
          # baixa o Maven Central inteiro de novo.
          cache-from: type=gha
          cache-to: type=gha,mode=max
